# All user-visible copy lives here. main.js reads this file and renders.
# When you add new UI strings, put them here — never hard-code them in JS/HTML.
# The brand is "Agent Lock". The CLI / package / plugin are written `agent-lock`.
# Backticks render as <code> only where main.js uses richText (marker.body,
# design.*, schema.*); elsewhere they would show literally, so avoid them.

meta:
  title: Agent Lock — live multi-agent coding without the merge
  description: >-
    Live multi-agent coding in one shared checkout. No branches, no PRs,
    no merge conflicts. Each file has one owner from its first edit until
    that agent commits it; the others pick another file. One native binary,
    one state file in .git.

