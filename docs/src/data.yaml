hero:
  eyebrow: live agentic development
  title:
    - Skip the merge.
    - Just edit.
  body: >-
    Google Docs, Figma, Notion — everywhere else we edit together, live.
    For code we still use branches, PRs, and merge conflicts.
    With multiple agents in one repo, we can finally do better.
    Agent Lock lets every agent edit the same tree at the same time —
    each file owned by one agent until it commits, each commit holding
    exactly one agent's work. One native binary, one state file, about
    7 ms per hook.
  install:
    label: install the Claude Code plugin
    command: 'claude plugin install agent-lock --marketplace lovieco/agent-lock'
    copyLabel: Copy
    copiedLabel: Copied
  stats:
    - { value: '7.4 ms',  label: 'per hook call (v0.2 in Node: 80 ms)' }
    - { value: '0',       label: runtime deps }
    - { value: '~10,300', label: lines of Rust }
    - { value: '267',     label: tests }

pitch:
  id: why
  eyebrow: the idea
  title: Code is the last thing we still merge
  body: >-
    In Docs, Figma, Notion, two people typing in the same file is normal.
    Code is the holdout — every change still goes through a branch, a PR,
    and a merge. With multi-agent coding, that loop is the bottleneck.
    Agent Lock removes it: agents share one tree on one branch, each file
    has one owner from its first edit until that agent commits it, and
    every commit holds exactly one agent's work. No branches. No PRs. No merge.
  flows:
    - kind: branch
      label: 'today: branch / PR / merge'
      tagline: Every change goes through git. With many agents, this scales badly.
      steps:
        - { n: '1', title: clone or worktree,    note: 'each agent gets its own full copy of the repo',           tone: neutral }
        - { n: '2', title: branch + edit,         note: 'agent works on a snapshot from the moment it branched',  tone: neutral }
        - { n: '3', title: commit + push + PR,    note: 'one PR per agent',                                       tone: neutral }
        - { n: '4', title: merge conflict,        note: 'two agents touched the same file',                       tone: bad }
        - { n: '5', title: human merge,           note: 'you read both diffs and stitch them together',           tone: bad }
        - { n: '6', title: retry,                 note: 'CI ran on the snapshot, not the merged result',          tone: bad }
      verdict: You pay the cost at the END, by hand, every time.
    - kind: agent-lock
      label: 'with Agent Lock: one shared tree'
      tagline: No clones. No branches. No merge step. Every agent edits the live repo.
      steps:
        - { n: '1', title: claim,  note: 'the first edit claims the file: one entry in .git/agent-lock.json',             tone: good }
        - { n: '2', title: edit,   note: 'as many edits as the task needs; other agents are told "taken"',               tone: good }
        - { n: '3', title: commit, note: 'agent-lock commit commits exactly this agent''s files and releases them',      tone: good }
        - { n: '4', title: push,   note: 'agent-lock push publishes without touching anyone else''s uncommitted work', tone: good }
      verdict: Collision is caught BEFORE either agent writes a byte.
  blocked:
    label: what a colliding agent sees
    lines:
      - '[agent-lock] BLOCKED: src/schema.ts is claimed by a1b2c3d4 (claimed 6m ago,'
      - 'last active 40s ago, holder process alive, 3 uncommitted edits).'
      - 'The holder keeps this file until it commits: do other work now.'
      - 'If you must wait: `agent-lock wait --claim /repo/src/schema.ts --timeout 540`'
      - 'with run_in_background.'
      - 'Never write it another way (redirection, sed -i, cp, scripts).'
  table:
    head: ['', 'branch / PR', 'Agent Lock']
    rows:
      - [when coordination happens,  at merge (after work),            at the first edit (before work)]
      - [who pays the cost,          'you, manually',                  'one flock transaction, about 2 ms']
      - [failure mode,               'lost updates, tangled commits',  'loud BLOCKED, agent does other work']
      - [what a commit contains,     whatever got staged,              exactly one agent's files]
      - [state lives in,             'PRs, git log, your head',        .git/agent-lock.json]
      - [scales with N agents,       merge pain ~ O(N²),               'one tree, no extra copies']

marker:
  id: how
  eyebrow: how it works
  title: How Agent Lock actually works
  body: >-
    Every Claude Code edit goes through a hook, and every git or package
    manager command an agent runs goes through a shim. Both are the same
    native binary. They give each changed file one owner, from its first
    edit until that agent commits it, and keep the record in one file,
    `.git/agent-lock.json`. Here is the whole protocol.
  protocol:
    - n: '1'
      title: Agent says "edit src/schema.ts"
      note: Claude Code runs Write, Edit, MultiEdit or NotebookEdit. Before the file is touched, the PreToolUse hook runs agent-lock hook pre-edit.
    - n: '2'
      title: Hook claims the file
      note: One flock transaction on .git/agent-lock.json — read, check, add the claim, write. If the file already has a live claim by another agent, that agent owns it.
    - n: '3'
      title: Free or yours → edit proceeds
      note: Agent Lock adds no prompt; the agent hears from it only when there is something to know, such as changes nobody claimed already in the file. The claim stays, counting edits, until the agent commits.
    - n: '4'
      title: Taken → BLOCKED
      note: The edit is denied with who holds the file and for how long. The agent does other work, or waits in the background.
    - n: '5'
      title: Done → agent-lock commit
      note: 'Commits exactly the files this agent holds and releases them. While others have work in the tree, the git shim refuses git add -A, bare git commit, stash, reset --hard, pull and rebase.'
    - n: '6'
      title: Crashed → takeover
      note: A dead owner's files can be taken over at once. If they hold uncommitted edits and others are active, the next agent's first try is refused once so it can look at the diff first.
  file:
    name: .git/agent-lock.json
    lines:
      - { kind: code, text: '$ cat .git/agent-lock.json' }
      - { kind: code, text: '{' }
      - { kind: code, text: '  "v": 3,' }
      - { kind: code, text: '  "claims": {' }
      - { kind: code, text: '    "src/schema.ts": {', tag: A }
      - { kind: code, text: '      "by": "a1b2c3d4",', tag: A }
      - { kind: code, text: '      "owner": { "pid": 82575, "start": 1792881276426716 },', tag: A }
      - { kind: code, text: '      "at": 1792881276, "touched": 1792881276, "edits": 3', tag: A }
      - { kind: code, text: '    },', tag: A }
      - { kind: code, text: '    "src/api.ts": {', tag: B }
      - { kind: code, text: '      "by": "e5f6a7b8:9f3e01aa", "edits": 1, …', tag: B }
      - { kind: code, text: '    }', tag: B }
      - { kind: code, text: '  },' }
      - { kind: code, text: '  "sessions": { … }, "locks": {}, "upstream": { … }' }
      - { kind: code, text: '}' }
      - { kind: code, text: '' }
      - { kind: code, text: '# every other file in /repo is free for any agent to claim', tag: free }
  legend:
    - { swatch: A,    label: 'session A holds src/schema.ts (3 uncommitted edits)' }
    - { swatch: B,    label: 'a subagent of session B holds src/api.ts' }
    - { swatch: free, label: every other file is free — any agent can claim it }

architecture:
  id: architecture
  eyebrow: architecture
  title: One binary, one state file
  body: >-
    Agents make tool calls. Hooks see the edits; shims see git and package
    manager commands as they really run. Both are the same native binary,
    and both read and change one file in the git dir, one flock transaction
    at a time.
  layers:
    - name: Agents
      path: Claude Code sessions and subagents
      role: 'Issue Edit / Write and Bash tool calls. Each has its own id: a1b2c3d4 for a session, a1b2c3d4:9f3e01aa for its subagent.'
    - name: Hooks
      path: hooks/hooks.json → agent-lock hook <event>
      role: PreToolUse claims or blocks edits and checks Bash for kill switches and wrong ids. PostToolUse counts writes. Stop releases what is clean and reminds agents to commit. SessionEnd cleans up. Any internal error fails open.
    - name: Shims
      path: $CLAUDE_PLUGIN_DATA/shims (git, npm, pnpm, yarn, bun, cargo, uv, poetry, go, bundle)
      role: 'The same binary under each tool''s name, first on the agents'' PATH. They refuse whole-tree git only while other agents have work in the tree, run installs one at a time, and claim manifests and lockfiles.'
    - name: State
      path: .git/agent-lock.json
      role: Every claim, session, wait and lock of one checkout, in one file. Inside the git dir, so it is never committed and never in your working tree. The kernel drops the flock if a process dies, so nothing gets stuck.
  sidecar:
    name: Skill + CLI
    path: skills/agent-lock/SKILL.md · bin/agent-lock
    role: What agents read to handle BLOCKED and to commit their own files. The agent-lock CLI (commit, push, sync, wait, status, doctor) is on the agents' PATH.

design:
  id: design
  eyebrow: design
  title: One file in .git, one lock, that's it
  body: >-
    When an agent first edits a file, Agent Lock adds an entry to
    `.git/agent-lock.json`. When the agent commits that file, the entry is
    removed. Every change is one transaction: open, `flock`, read, change,
    one write. Every agent reads the same file, so they know what's taken.
    No server, no database, no daemon.
  principles:
    - name: The file is the truth
      body: >-
        Want to know who is changing what right now? Run `agent-lock status`,
        or read `.git/agent-lock.json`. One claim = one agent owns one file's
        uncommitted changes. No claim = nobody does.
    - name: One owner per change
      body: >-
        A file is claimed from an agent's first edit until that agent
        commits it. No other agent's edit lands in between, so every commit
        holds exactly one agent's work, and `git log` says who changed what.
    - name: One file at a time
      body: >-
        Agent Lock claims whole files, not parts of files. If two agents
        want the same file, one does other work or waits. Simpler than
        tracking which line belongs to whom — and it matches how agents
        work anyway (they rewrite big chunks).
    - name: Your repo stays clean
      body: >-
        The state lives inside the git dir, never in your source files or
        your working tree. Nothing to `.gitignore`, nothing to commit. Your
        `git diff` only shows real work.
    - name: Living owners keep their work
      body: >-
        An agent that is still running never loses its uncommitted files to
        a timer. If it crashes, its process is gone, and the next agent may
        take its files over — with a warning when they hold unfinished edits.
    - name: Nothing to run, nothing stuck
      body: >-
        No background process, no service, no port. The `flock` is held for
        one transaction and dropped by the kernel if a process dies. If a
        hook fails, or a machine has no binary, the agent carries on.
  lifecycle:
    label: a claim's life, start to finish
    lines:
      - '  ┌────────┐  first edit  ┌─────────┐   written    ┌─────────┐'
      - '  │  free  │ ───────────► │ claimed │ ───────────► │  dirty  │'
      - '  └────────┘              └─────────┘              └─────────┘'
      - '       ▲                       │                        │'
      - '       │   end of turn,        │    agent-lock commit   │'
      - '       │   never written       │                        │'
      - '       └───────────────────────┴────────────────────────┘'

schema:
  id: schema
  eyebrow: schema
  title: 'The state file, in a few KB'
  body: >-
    All coordination state for a worktree is one JSON file,
    `.git/agent-lock.json`: claims, sessions, waits, locks, orphan notes,
    the upstream tip and the off switch. Claims are keyed by the
    repo-relative path in git's spelling (NFC on macOS, lower-cased under
    `core.ignorecase`), so one file never gets two claims. It is changed
    only inside a `flock` transaction; a file written by a newer
    agent-lock is never rewritten.
  file:
    name: .git/agent-lock.json
    lines:
      - '{'
      - '  "v": 3,'
      - '  "claims": {'
      - '    "src/schema.ts": {'
      - '      "by":       "a1b2c3d4",'
      - '      "session":  "a1b2c3d4-1111-4111-8111-111111111111",'
      - '      "owner":    { "pid": 82575, "start": 1792881276426716 },'
      - '      "at":       1792881276,'
      - '      "touched":  1792881276,'
      - '      "edits":    3,'
      - '      "made_by":  "toolu_2"'
      - '    }'
      - '  },'
      - '  "sessions": { "a1b2c3d4-1111-…": { "agent": "a1b2c3d4", "phase": "active", … } },'
      - '  "locks":    {},'
      - '  "upstream": { "remote": "origin", "branch": "main", "oid": "1c8c7404…" }'
      - '}'
  fields:
    - name: by
      type: string
      role: >-
        The holder. Main agent: `a1b2c3d4` (from the session id). Subagent:
        `a1b2c3d4:9f3e01aa`. Scripts: any id without a colon.
    - name: session / owner
      type: string / object
      role: >-
        The holder's session and its Claude Code process: `pid` and the
        process start time. Decides whether the holder is alive; a start
        time that no longer matches means the pid was reused.
    - name: at / touched
      type: number (epoch s)
      role: >-
        When the file was claimed, and when the claim was last active (an
        edit, a hand-over, a commit attempt). With the session's last
        activity, the basis for idle limits.
    - name: edits
      type: number
      role: >-
        Successful writes since the claim began. `0` means claimed but
        never written; such claims are released at the end of the turn
        (except an `agent-lock wait --claim` reservation).
    - name: pending
      type: string (omitted when empty)
      role: >-
        An operation in flight: a `tool_use_id`, or `commit:<pid>:<start>`
        / `pkg:<pid>:<start>`. While set, the claim cannot change hands.
    - name: made_by
      type: string
      role: >-
        The tool call that created the claim. A failed or rejected edit
        releases only a claim it created itself, never one the agent already
        held.
    - name: inherited / reason
      type: string (omitted when empty)
      role: >-
        `inherited`: whose uncommitted edits came with a claim a subagent
        took; its commit leaves the file to them unless it names it.
        `reason`: `wait` for an `agent-lock wait --claim` reservation.
    - name: sessions / locks
      type: object
      role: >-
        Per session: phase, subagents, who waits for its files, what its
        agents wait for. `locks.git`, `locks.pkg` and `locks.sync`
        serialize agent-lock's own commits, package installs and an
        upstream install.
    - name: orphans / upstream
      type: object
      role: >-
        `orphans`: dirty claims that ended without a commit, so the next
        claimant is told whose changes are in the file. `upstream`: the
        last integrated remote tip, for rewrite detection and the push lease.
  stale:
    label: a claim held by another agent may be taken over when, in order
    rules:
      - 'never while an `agent-lock commit` or a package install working on it is still running'
      - 'the owner process is gone — its pid exited, is a zombie, or was reused (start time differs)'
      - "the holder's session ended and you are the same Claude Code process (`/clear`)"
      - 'never while the owner is alive and the claim has uncommitted edits; an alive owner''s never-written claim after 45 min idle'
      - 'a claim with no known owner process (a script without `$CLAUDE_PID`) after 10 min idle'

install:
  id: install
  eyebrow: install
  title: One command. You're done.
  steps:
    - n: '01'
      label: Install the plugin
      command: claude plugin install agent-lock --marketplace lovieco/agent-lock
      note: 'from a shell (Claude Code 2.1.292+; in a session: /plugin install agent-lock --marketplace lovieco/agent-lock). Hooks, shims, the skill and the agent-lock CLI, active in every git repo you open; nothing is written into your working trees (the state lives in .git). On a machine without a binary for it, agent-lock stays inactive and never blocks.'
    - n: '02'
      label: Share it with your team (optional)
      command: agent-lock install
      note: 'adds the plugin to the project''s .claude/settings.json; commit that file and every teammate who opens the repo in Claude Code gets it'
    - n: '03'
      label: Verify (optional)
      command: agent-lock selftest
      note: 'runs the real hooks, shims and CLI in a throwaway repo with a bare remote: 12 steps, PASS or FAIL each, under a second'
  requirements:
    - 'Claude Code with plugins'
    - 'git ≥ 2.40'
    - 'macOS or Linux'
    - 'no Node, no runtime'

